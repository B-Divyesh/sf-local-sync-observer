[package]
name = "local-sync-observer"
version = "0.1.2"
description = "A read-only convergence dashboard for local-first tools"
authors = ["Sociobot"]
edition = "2021"
license = "MIT"

[lib]
name = "local_sync_observer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
local-sync-observer-core = { path = "../crates/observer-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
