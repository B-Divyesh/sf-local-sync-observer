name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        default: v0.1.9

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify candidate tag identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          echo "LSO_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Local Sync Observer ${{ env.RELEASE_TAG }}
          releaseBody: "Read-only local status checks for Syncthing, Nextcloud desktop logs, and folder metadata. Builds are unsigned; verify SHA256SUMS before installing."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify candidate tag identity
        run: test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download built assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Build checksum and download manifests
        run: node scripts/release-manifest.mjs release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(git rev-parse HEAD)"
      - name: Verify every download identifies this candidate
        run: node scripts/verify-release-identity.mjs release-assets/latest.json "$RELEASE_TAG" "$(git rev-parse HEAD)"
      - name: Upload manifests and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
