[package]
name = "local-sync-observer-core"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Read-only folder and Syncthing evidence checks for Local Sync Observer"

[lib]
name = "local_sync_observer_core"
path = "src/lib.rs"

[dependencies]
minreq = { version = "2.14", default-features = false, features = ["https-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
